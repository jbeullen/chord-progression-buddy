<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chord Progression Buddy</title>
<meta name="description" content="Pick a key and see its diatonic chords in both the number system and real chord names, plus secondary dominants, modal interchange and the route to the relative key.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127929;</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">♭♯</span>
      <span class="brand-text">
        <strong>Chord Progression Buddy</strong>
        <em data-i18n="app.tagline"></em>
      </span>
    </div>

    <div class="controls">
      <div class="seg seg-view" id="viewToggle" role="group">
        <button type="button" data-view="theory" class="on" data-i18n="view.theory"></button>
        <button type="button" data-view="song" data-i18n="view.song"></button>
      </div>
      <div class="seg" id="modeToggle" role="group">
        <button type="button" data-mode="major" class="on" data-i18n="quality.major"></button>
        <button type="button" data-mode="minor" data-i18n="quality.minor"></button>
      </div>
      <button type="button" class="toggle" id="seventhToggle" aria-pressed="false" data-i18n="toggle.sevenths"></button>
      <div class="seg seg-sound" id="instrumentToggle" role="group" data-i18n-aria="instrument.label">
        <button type="button" data-instrument="synth" class="on" data-i18n="instrument.synth"></button>
        <button type="button" data-instrument="piano" data-i18n="instrument.piano"></button>
      </div>
      <button type="button" class="toggle" id="muteToggle" aria-pressed="false" data-i18n-title="toggle.muteTitle"></button>
      <button type="button" class="toggle lang-toggle" id="langToggle" data-lang="nl"></button>
    </div>
  </div>

  <nav class="keybar" aria-label="Key">
    <div class="keybar-inner">
      <span class="keybar-label" data-i18n="keybar.label"></span>
      <div class="key-chips" id="keyChips"></div>
      <button type="button" class="enharm" id="enharmSwap" hidden></button>
      <span class="key-sig" id="keySig"></span>

      <!-- Tempo governs every sound the page makes, so it lives here rather
           than inside either mode. -->
      <div class="tempo">
        <label for="tempo" data-i18n="tempo.label"></label>
        <button type="button" class="tempo-step" id="tempoDown" data-i18n-aria="tempo.slower">−</button>
        <input type="range" id="tempo" min="40" max="240" step="1" value="120"
               data-i18n-aria="tempo.aria">
        <button type="button" class="tempo-step" id="tempoUp" data-i18n-aria="tempo.faster">+</button>
        <output for="tempo" id="tempoValue">120 BPM</output>
        <span class="tempo-hint" data-i18n="tempo.hint"></span>
      </div>
    </div>
  </nav>
</header>

<main>

  <p class="audio-notice" id="audioNotice" hidden></p>

  <!-- --------------------------------------------------------- song mode -->
  <div id="songView" hidden>
    <section class="panel">
      <div class="panel-head">
        <h1 id="songTitle">Build a progression in C major</h1>
        <p class="sub" data-i18n="song.sub"></p>
      </div>
      <div class="song-grid" id="songGrid"></div>
    </section>

    <section class="panel">
      <div class="panel-head song-head">
        <h2 data-i18n="prog.heading"></h2>
        <div class="transport">
          <button type="button" class="transport-btn play" id="progPlay"></button>
          <button type="button" class="transport-btn" id="progStop"></button>
          <button type="button" class="transport-btn" id="progLoop" aria-pressed="false"></button>
          <button type="button" class="transport-btn" id="progClear"></button>
        </div>
      </div>
      <div class="prog-strip" id="progStrip"></div>

      <form class="chord-input" id="chordForm" autocomplete="off">
        <label for="chordText" data-i18n="chordinput.label"></label>
        <input type="text" id="chordText" spellcheck="false" autocapitalize="off"
               data-i18n-placeholder="chordinput.placeholder"
               data-i18n-aria="chordinput.label">
        <button type="submit" class="transport-btn" id="chordAdd" data-i18n="chordinput.add"></button>
        <span class="chord-echo" id="chordEcho" aria-live="polite"></span>
        <p class="chord-hint" data-i18n="chordinput.hint"></p>
      </form>
    </section>
  </div>

  <!-- ---------------------------------------------------------- diatonic -->
  <div id="theoryView">
  <section class="panel hero" id="diatonicPanel">
    <div class="panel-head">
      <h1 id="keyTitle">The chords in C major</h1>
      <p class="scale-line" id="scaleLine"></p>
    </div>
    <div class="chord-row" id="chordRow"></div>
    <p class="legend">
      <span class="dot fn-tonic"></span> <span data-i18n="legend.tonic"></span>
      <span class="dot fn-predominant"></span> <span data-i18n="legend.predominant"></span>
      <span class="dot fn-dominant"></span> <span data-i18n="legend.dominant"></span>
      <span class="hint" data-i18n="legend.hint"></span>
    </p>
    <p class="number-key">
      <span data-i18n="numbers.label"></span><span><b>1</b> <span data-i18n="numbers.major"></span></span><span><b>2-</b> <span data-i18n="numbers.minor"></span></span><span><b>5D</b> <span data-i18n="numbers.dominant"></span></span><span><b>7-♭5</b> <span data-i18n="numbers.halfDim"></span></span>
    </p>
  </section>

  <div class="split">
    <!-- ---------------------------------------------------------- detail -->
    <section class="panel" id="detailPanel"></section>

    <!-- -------------------------------------------------------- relative -->
    <section class="panel" id="relativePanel"></section>
  </div>

  <!-- ------------------------------------------------ secondary dominants -->
  <section class="panel" id="secondaryPanel"></section>

  <!-- ------------------------------------------------- modal interchange -->
  <section class="panel" id="borrowedPanel"></section>

  <!-- ----------------------------------------------------- progressions -->
  <section class="panel" id="progressionPanel"></section>
  </div><!-- /theoryView -->

  <!-- --------------------------------------------------------- diagnostics -->
  <section class="panel debug-panel" id="debugPanel" hidden>
    <div class="panel-head">
      <h2 data-i18n="diag.heading"></h2>
      <p class="sub" data-i18n="diag.sub"></p>
    </div>
    <div class="debug-controls">
      <button type="button" class="toggle" id="soundTest"></button>
      <button type="button" class="toggle" id="debugRefresh" data-i18n="diag.refresh"></button>
    </div>
    <p class="audio-notice" id="debugResult" hidden></p>
    <dl class="debug-facts" id="debugFacts"></dl>
  </section>

  <footer class="footer">
    <p data-i18n="footer.line1"></p>
    <p class="footer-sub" data-i18n="footer.line2"></p>
    <p class="footer-sub">
      <button type="button" class="link-button" id="debugToggle" aria-expanded="false" data-i18n="diag.link"></button>
    </p>
  </footer>
</main>

<script src="js/i18n.js"></script>
<script src="js/theory.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
