name: Test and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than stacking up behind new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Theory tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    # Only the default branch is published, whatever it happens to be named.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r css js _site/
          # Stamp every asset URL with the commit. Without this the browser
          # keeps the previous deploy's stylesheet and scripts — index.html is
          # revalidated, but the files it pulls in are not, so a change can ship
          # green and still not reach anyone who has been here before.
          sed -E 's#(href="css/[^"]*|src="js/[^"]*)"#\1?v='"${GITHUB_SHA:0:8}"'"#g' index.html > _site/index.html
          grep -c '?v=' _site/index.html   # fails the deploy if nothing was stamped
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
